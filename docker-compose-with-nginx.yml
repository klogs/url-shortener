# Production compose with nginx reverse proxy + Let's Encrypt TLS.
#
# Required .env variables:
#   DOMAIN_REDIRECT=klo.gs          # main domain (short codes + frontend)
#   DOMAIN_API=api.klo.gs           # API subdomain
#   CERTBOT_EMAIL=you@example.com   # email for Let's Encrypt notifications
#
# First-time setup:
#   chmod +x infra/nginx/init-letsencrypt.sh
#   ./infra/nginx/init-letsencrypt.sh
#
# Then start the full stack:
#   docker compose -f docker-compose-with-nginx.yml up -d
#
# With observability:
#   docker compose -f docker-compose-with-nginx.yml --profile observability up -d

services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shortener
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shortener_dev}
      RABBITMQ_DEFAULT_VHOST: shortener
    ports:
      - "5672:5672"
      - "15672:15672"    # management UI (internal access only)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Migration (runs once, then exits) ─────────────────────────────────────

  shortener-migrator:
    build:
      context: .
      dockerfile: src/Shortener.Migrator/Dockerfile
    image: klogs/shortener-migrator:latest
    restart: "no"
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=shortener;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener_dev}"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Application Services (no host port exposure — nginx is the entry point) ─

  shortener-api:
    build:
      context: .
      dockerfile: src/Shortener.Api/Dockerfile
    image: klogs/shortener-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=shortener;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener_dev}"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "shortener"
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-shortener_dev}
      RabbitMq__VirtualHost: "shortener"
      Auth__Authority: "${AUTH__ISSUER:-https://idp.klogs.io}"
      Auth__ClientId: "${AUTH__CLIENT_ID:-klogs.web}"
      Auth__ClientSecret: "${AUTH__CLIENT_SECRET:-}"
      Captcha__Provider: "${CAPTCHA__PROVIDER:-Disabled}"
      Captcha__SiteKey: "${CAPTCHA__SITE_KEY:-}"
      Captcha__SecretKey: "${CAPTCHA__SECRET_KEY:-}"
      MultiTenancy__Mode: "${MULTITENANCY__MODE:-SingleTenant}"
      App__DefaultDomain: "${APP__DEFAULT_DOMAIN:-klo.gs}"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    depends_on:
      shortener-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  shortener-redirect:
    build:
      context: .
      dockerfile: src/Shortener.Redirect/Dockerfile
    image: klogs/shortener-redirect:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=shortener;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener_dev}"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "shortener"
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-shortener_dev}
      RabbitMq__VirtualHost: "shortener"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    depends_on:
      shortener-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  shortener-worker:
    build:
      context: .
      dockerfile: src/Shortener.Worker/Dockerfile
    image: klogs/shortener-worker:latest
    restart: unless-stopped
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=shortener;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener_dev}"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "shortener"
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-shortener_dev}
      RabbitMq__VirtualHost: "shortener"
    depends_on:
      shortener-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  shortener-web:
    build:
      context: web/shortener-web
      dockerfile: Dockerfile
    image: klogs/shortener-web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: "http://shortener-api:8080"
      NEXT_PUBLIC_CAPTCHA_SITE_KEY: "${CAPTCHA__SITE_KEY:-}"
      AUTH_ISSUER: "${AUTH__ISSUER:-https://idp.klogs.io}"
      AUTH_CLIENT_ID: "${AUTH__CLIENT_ID:-klogs.web}"
      AUTH_CLIENT_SECRET: "${AUTH__CLIENT_SECRET:-}"
      AUTH_SECRET: "${AUTH__SECRET:-change-me-in-production}"
      AUTH_URL: "https://${DOMAIN_REDIRECT:-localhost}"
    depends_on:
      - shortener-api

  # ─── nginx + Let's Encrypt ─────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # conf.d is a bind-mount so init-letsencrypt.sh can write 20-https.conf
      # after certs are obtained, then signal nginx to reload.
      # 10-http.conf (HTTP-only) is always present; 20-https.conf is added by init script.
      - ./infra/nginx/conf.d:/etc/nginx/conf.d
      # TLS certificates managed by certbot
      - letsencrypt_data:/etc/letsencrypt:ro
      # ACME webroot challenge directory
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - shortener-api
      - shortener-redirect
      - shortener-web

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renew every 12 hours; certbot only acts when cert expires within 30 days
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do
          certbot renew --quiet --webroot --webroot-path=/var/www/certbot;
          sleep 12h & wait $${!};
        done
      "

  # ─── Observability (docker compose --profile observability up) ──────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./infra/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"    # offset to avoid port clash with shortener-web in dev
    depends_on:
      - prometheus

volumes:
  postgres_data:
  rabbitmq_data:
  letsencrypt_data:
  certbot_www:
  prometheus_data:
  grafana_data:
