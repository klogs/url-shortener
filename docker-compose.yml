services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shortener
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shortener_dev}
      RABBITMQ_DEFAULT_VHOST: shortener
    ports:
      - "5672:5672"
      - "15672:15672"    # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Migration (runs once, then exits) ─────────────────────────────────────

  shortener-migrator:
    build:
      context: .
      dockerfile: src/Shortener.Migrator/Dockerfile
    image: klogs/shortener-migrator:latest
    restart: "no"
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=shortener;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener_dev}"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Application Services ──────────────────────────────────────────────────

  shortener-api:
    build:
      context: .
      dockerfile: src/Shortener.Api/Dockerfile
    image: klogs/shortener-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=shortener;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener_dev}"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "shortener"
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-shortener_dev}
      RabbitMq__VirtualHost: "shortener"
      Auth__Authority: "${AUTH__ISSUER:-https://idp.klogs.io}"
      Auth__ClientId: "${AUTH__CLIENT_ID:-klogs.web}"
      Auth__ClientSecret: "${AUTH__CLIENT_SECRET:-}"
      Captcha__Provider: "${CAPTCHA__PROVIDER:-Disabled}"
      Captcha__SiteKey: "${CAPTCHA__SITE_KEY:-}"
      Captcha__SecretKey: "${CAPTCHA__SECRET_KEY:-}"
      MultiTenancy__Mode: "${MULTITENANCY__MODE:-SingleTenant}"
      App__DefaultDomain: "${APP__DEFAULT_DOMAIN:-localhost:8081}"
    depends_on:
      shortener-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  shortener-redirect:
    build:
      context: .
      dockerfile: src/Shortener.Redirect/Dockerfile
    image: klogs/shortener-redirect:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=shortener;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener_dev}"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "shortener"
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-shortener_dev}
      RabbitMq__VirtualHost: "shortener"
    depends_on:
      shortener-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  shortener-worker:
    build:
      context: .
      dockerfile: src/Shortener.Worker/Dockerfile
    image: klogs/shortener-worker:latest
    restart: unless-stopped
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=shortener;Username=shortener;Password=${POSTGRES_PASSWORD:-shortener_dev}"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "shortener"
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-shortener_dev}
      RabbitMq__VirtualHost: "shortener"
    depends_on:
      shortener-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  shortener-web:
    build:
      context: web/shortener-web
      dockerfile: Dockerfile
    image: klogs/shortener-web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-side proxy target — browser always calls same-origin frontend
      BACKEND_API_URL: "http://shortener-api:8080"
      NEXT_PUBLIC_CAPTCHA_SITE_KEY: "${CAPTCHA__SITE_KEY:-}"
      # OIDC
      AUTH_ISSUER: "${AUTH__ISSUER:-https://idp.klogs.io}"
      AUTH_CLIENT_ID: "${AUTH__CLIENT_ID:-klogs.web}"
      AUTH_CLIENT_SECRET: "${AUTH__CLIENT_SECRET:-}"
      AUTH_SECRET: "${AUTH__SECRET:-change-me-in-production}"
      # Required in Codespaces / behind a reverse proxy:
      # AUTH_URL: "https://<your-codespaces-or-domain>:3000"
    depends_on:
      - shortener-api

  # ─── Observability (docker compose --profile observability up) ──────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./infra/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
